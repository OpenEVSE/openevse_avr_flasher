# ============================================================
#  OpenEVSE Firmware Flasher - Automated Build & Release
#
#  Builds a standalone program (no Python needed) for Windows,
#  macOS (Apple Silicon + Intel) and Linux, smoke-tests each one,
#  and attaches them to a GitHub Release.
#
#  New release:
#    git tag v1.1.0
#    git push origin v1.1.0
#
#  Add / refresh the downloads on an existing release:
#    Actions -> Build & Release -> Run workflow -> tag: v1.0.0
#
#  Pushes to main and pull requests build and test only.
# ============================================================

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the downloads to (blank = build only)'
        required: false
        default: ''

permissions:
  contents: write   # required to create/update releases

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: OpenEVSE_Flasher-windows.exe

          - name: macOS Apple Silicon
            os: macos-latest
            asset: OpenEVSE_Flasher-macos-apple-silicon.zip

          - name: macOS Intel
            os: macos-15-intel
            asset: OpenEVSE_Flasher-macos-intel.zip

          # Oldest supported runner = widest glibc compatibility
          - name: Linux
            os: ubuntu-22.04
            asset: OpenEVSE_Flasher-linux-x86_64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          pip install pyinstaller
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Windows uses avrdude/avrdude.exe from the repo. macOS / Linux bundle
      # the system avrdude; PyInstaller packs its shared libraries with it.
      - name: Install avrdude (macOS)
        if: runner.os == 'macOS'
        run: brew install avrdude

      - name: Install avrdude (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y avrdude xvfb

      - name: Build executable
        shell: bash
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          pyinstaller --noconfirm openevse_flasher.spec

      # ── Smoke tests ────────────────────────────────────────
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          python scripts/smoke_test.py avrdude avrdude/avrdude.exe avrdude/avrdude.conf
          python scripts/smoke_test.py app dist/OpenEVSE_Flasher.exe

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/OpenEVSE Flasher.app"
          # Prove the bundled avrdude works without Homebrew's copy
          # (uninstall leaves etc/avrdude.conf behind, so remove that too)
          BREW_PREFIX=$(brew --prefix)
          brew uninstall --ignore-dependencies avrdude libusb libusb-compat hidapi libftdi || true
          rm -f "$BREW_PREFIX/etc/avrdude.conf"
          AVRDUDE=$(find "$APP" -type f -name avrdude | head -1)
          CONF="$(dirname "$AVRDUDE")/avrdude.conf"   # where the app looks
          test -n "$AVRDUDE" && test -f "$CONF"
          python scripts/smoke_test.py avrdude "$AVRDUDE" "$CONF"
          python scripts/smoke_test.py app "$APP/Contents/MacOS/OpenEVSE_Flasher"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          # Run without the system avrdude, its libraries or its config
          sudo apt-get remove -y avrdude libftdi1 libusb-0.1-4 libhidapi-libusb0 || true
          sudo rm -f /etc/avrdude.conf
          xvfb-run -a python scripts/smoke_test.py app dist/OpenEVSE_Flasher

      # ── Package ────────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/OpenEVSE_Flasher.exe "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks and code signature intact
        run: ditto -c -k --keepParent "dist/OpenEVSE Flasher.app" "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/OpenEVSE_Flasher
          cp dist/OpenEVSE_Flasher pkg/OpenEVSE_Flasher/
          chmod +x pkg/OpenEVSE_Flasher/OpenEVSE_Flasher
          tar -czf "${{ matrix.asset }}" -C pkg OpenEVSE_Flasher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # Attach all downloads to the GitHub Release
  # ──────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            *.exe
            *.zip
            *.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
